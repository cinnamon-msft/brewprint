name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/Brewprint.Web/package-lock.json
      - run: dotnet test Brewprint.sln --configuration Release
      - run: npm ci
        working-directory: src/Brewprint.Web
      - run: npm run build && npm test
        working-directory: src/Brewprint.Web
      - run: npx playwright install --with-deps chromium
        working-directory: src/Brewprint.Web
      - run: npm run test:e2e
        working-directory: src/Brewprint.Web
      - run: dotnet publish src/Brewprint.Api --configuration Release --output artifacts/publish
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: src/Brewprint.Web/test-results
